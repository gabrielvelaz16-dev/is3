# Integración continua (S1-06, plan de configuración §6).
# En cada push y en cada PR hacia develop/main: instalación limpia, tipos,
# lint, pruebas con cobertura, migraciones sobre PostgreSQL real, seed,
# verificación de indicadores (S6-04), build y auditoría de dependencias.
# Un paso que falla deja el PR en rojo.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Express + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: expediente_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d expediente_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Credenciales solo de la base efímera de CI (no son secretos reales).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/expediente_ci?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias (npm ci)
        run: npm ci
      - name: Verificar tipos (incluye prisma generate)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas con cobertura
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Resumen de pruebas (evidencia)
        if: always()
        run: node ../scripts/ci/resumen-pruebas.mjs vitest-results.json coverage/coverage-summary.json "Pruebas backend"
      - name: Aplicar migraciones en PostgreSQL de CI
        run: npx prisma migrate deploy
      - name: Seed (usuarios, roles y permisos)
        run: npm run db:seed
      - name: Datos de demostración por la API, dos veces (S8-02)
        env:
          NODE_ENV: development
          LOG_LEVEL: warn
        run: |
          nohup npx tsx src/server.ts > ../backend-demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/api/health >/dev/null || { echo "::error title=Demo::el backend no respondió"; tail -30 ../backend-demo.log; exit 1; }
          npm run demo:cargar
          antes=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -tAc "SELECT count(*) FROM expedientes")
          # La segunda vez no debe duplicar nada.
          npm run demo:cargar
          despues=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -tAc "SELECT count(*) FROM expedientes")
          [ "$antes" -eq "$despues" ] || { echo "::error title=Demo::la segunda carga duplicó expedientes ($antes → $despues)"; exit 1; }
          resumen=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -tAc "SELECT string_agg(estado || '=' || n, ', ' ORDER BY estado) FROM (SELECT estado, count(*) n FROM expedientes GROUP BY estado) t")
          echo "::notice title=Datos de demostración::$despues expedientes ($resumen)"
          kill %1 || true
      - name: Verificar tablas de solo inserción (ADR-07, historial de los Sprints 4 y 5)
        run: |
          # Una fila por tabla: en una tabla vacía un DELETE no dispara los triggers por fila
          # y la verificación daría un falso "OK".
          PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auditoria (accion, resultado) VALUES ('ci.verificacion', 'EXITO');
          INSERT INTO documentos (expediente_id, nombre_original, nombre_almacenado, tipo_mime, tamano_bytes, hash_sha256, subido_por_id)
            SELECT (SELECT min(id) FROM expedientes), 'ci.pdf', gen_random_uuid()::text, 'application/pdf', 1, repeat('0', 64), (SELECT min(id) FROM usuarios);
          INSERT INTO actuaciones (expediente_id, tipo, texto, autor_id)
            SELECT (SELECT min(id) FROM expedientes), 'ACTUACION', 'Fila de verificación de CI', (SELECT min(id) FROM usuarios);
          INSERT INTO cambios_estado (expediente_id, estado_anterior, estado_nuevo, usuario_id)
            SELECT (SELECT min(id) FROM expedientes), NULL, 'BORRADOR', (SELECT min(id) FROM usuarios);
          INSERT INTO asignaciones (expediente_id, responsable_id, usuario_id)
            SELECT (SELECT min(id) FROM expedientes), NULL, (SELECT min(id) FROM usuarios);
          INSERT INTO pases (expediente_id, origen_id, destino_id, motivo, enviado_por_id)
            SELECT (SELECT min(id) FROM expedientes), (SELECT min(id) FROM dependencias), (SELECT max(id) FROM dependencias),
                   'Fila de verificación de CI', (SELECT min(id) FROM usuarios);
          SQL
          # Un pase solo admite registrar su recepción: cambiar el destino debe fallar.
          if PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -v ON_ERROR_STOP=1 -c "UPDATE pases SET motivo = 'otro';" >/dev/null 2>&1; then
            echo "::error title=Solo inserción::pases permitió modificar el motivo"; exit 1
          fi
          for tabla in auditoria documentos actuaciones cambios_estado asignaciones pases; do
            filas=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -tAc "SELECT count(*) FROM $tabla")
            if [ "$filas" -eq 0 ]; then echo "::error title=Solo inserción::$tabla está vacía; la verificación no sería válida"; exit 1; fi
            for sql in "DELETE FROM $tabla;" "UPDATE $tabla SET id = id;" "TRUNCATE $tabla;"; do
              if PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -v ON_ERROR_STOP=1 -c "$sql" >/dev/null 2>&1; then
                echo "::error title=Solo inserción::$tabla permitió: $sql"; exit 1
              fi
            done
            echo "OK: $tabla rechazó DELETE, UPDATE y TRUNCATE"
          done
      - name: Verificar indicadores del dashboard contra la base (S6-04)
        run: npx tsx prisma/verificar-indicadores.ts
      - name: Respaldo y restauración en una base nueva (S7-04, RNF-07)
        run: |
          set -o pipefail
          # Un documento real (archivo + fila con su hash) para comprobar que viaja en el respaldo.
          UUID=$(cat /proc/sys/kernel/random/uuid)
          mkdir -p ../storage/documentos
          printf '%%PDF-1.4 documento de verificacion de respaldo' > "../storage/documentos/$UUID"
          HASH=$(sha256sum "../storage/documentos/$UUID" | cut -d' ' -f1)
          PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -v ON_ERROR_STOP=1 -c \
            "INSERT INTO documentos (expediente_id, nombre_original, nombre_almacenado, tipo_mime, tamano_bytes, hash_sha256, subido_por_id)
             SELECT min(e.id), 'respaldo-ci.pdf', '$UUID', 'application/pdf', 46, '$HASH', (SELECT min(id) FROM usuarios) FROM expedientes e;"
          npm run respaldo:crear | tee respaldo.log
          DIR=$(sed -n 's/^Respaldo creado: //p' respaldo.log)
          [ -d "$DIR" ] || { echo "::error title=Respaldo::no se creó la carpeta del respaldo"; exit 1; }
          PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -v ON_ERROR_STOP=1 -c "CREATE DATABASE expediente_restaurada;"
          export RESTAURADA="postgresql://ci:ci@localhost:5432/expediente_restaurada?schema=public"
          DATABASE_URL="$RESTAURADA" npx prisma migrate deploy
          # Sin --confirmar solo verifica; con --confirmar restaura y compara filas y documentos.
          DATABASE_URL="$RESTAURADA" STORAGE_PATH=/tmp/storage-restaurado npm run respaldo:restaurar -- "$DIR"
          DATABASE_URL="$RESTAURADA" STORAGE_PATH=/tmp/storage-restaurado npm run respaldo:restaurar -- "$DIR" --confirmar | tee restauracion.log
          # El documento quedó en el almacenamiento restaurado con el mismo contenido.
          [ "$(sha256sum "/tmp/storage-restaurado/$UUID" | cut -d' ' -f1)" = "$HASH" ] || { echo "::error title=Respaldo::el documento restaurado no coincide"; exit 1; }
          # Restaurar otra vez sobre la base ya restaurada debe fallar (no está vacía).
          if DATABASE_URL="$RESTAURADA" STORAGE_PATH=/tmp/storage-restaurado npm run respaldo:restaurar -- "$DIR" --confirmar; then
            echo "::error title=Respaldo::se pudo restaurar sobre una base con datos"; exit 1
          fi
          # Un respaldo alterado debe rechazarse.
          cp -r "$DIR" /tmp/respaldo-alterado
          sed -i 's/Administración General/Administracion alterada/' /tmp/respaldo-alterado/datos.json
          if npm run respaldo:verificar -- /tmp/respaldo-alterado; then
            echo "::error title=Respaldo::se aceptó un respaldo alterado"; exit 1
          fi
          # Comparación independiente: las dos bases tienen las mismas filas por tabla
          # (cada una suma un evento de auditoría: respaldo.crear en el origen y respaldo.restaurar en la copia).
          for tabla in dependencias roles permisos roles_permisos usuarios auditoria secuencias expedientes documentos actuaciones cambios_estado tareas pases asignaciones notificaciones; do
            origen=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_ci -tAc "SELECT count(*) FROM $tabla")
            copia=$(PGPASSWORD=ci psql -h localhost -U ci -d expediente_restaurada -tAc "SELECT count(*) FROM $tabla")
            if [ "$origen" != "$copia" ]; then echo "::error title=Respaldo::$tabla: origen $origen, restaurada $copia"; exit 1; fi
          done
          echo "::notice title=Respaldo y restauración (S7-04)::$(tail -n 1 restauracion.log) Las 15 tablas coinciden con el origen; se rechazó restaurar sobre una base con datos y un respaldo alterado."
      - name: Medir rendimiento con 1000 expedientes (S7-05)
        run: npx tsx prisma/medir-rendimiento.ts
      - name: Build
        run: npm run build
      - name: Auditoría de dependencias de producción
        run: node ../scripts/ci/audit.mjs

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias (npm ci)
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-results.json
      - name: Resumen de pruebas (evidencia)
        if: always()
        run: node ../scripts/ci/resumen-pruebas.mjs vitest-results.json "" "Pruebas frontend"
      - name: Build
        run: npm run build
      - name: Auditoría de dependencias de producción
        run: node ../scripts/ci/audit.mjs
