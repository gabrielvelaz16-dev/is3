# PostgreSQL local para el proyecto IS3 (ADR-04, tarjeta F0-07).
#
# Ejecutar SIEMPRE desde la raíz del repositorio, pasando el .env:
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d
#
# Las credenciales vienen de .env (ver .env.example). No escribir claves aquí.

name: is3

services:
  db:
    image: postgres:18-alpine
    container_name: is3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      TZ: America/Asuncion
      PGTZ: America/Asuncion
    ports:
      # Solo accesible desde esta PC (127.0.0.1), no desde la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 los datos se montan en /var/lib/postgresql.
      - is3_pgdata:/var/lib/postgresql
      # Scripts que se ejecutan solo la PRIMERA vez (volumen vacío).
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  is3_pgdata:
